name: dino-brawl-tool APK

on:
  push:
    branches: ["main", "**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/dino-brawl-tool-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: dino-brawl-tool-apk
          path: app/build/outputs/apk/debug/dino-brawl-tool-debug.apk
          if-no-files-found: error
          retention-days: 14
